[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cfp-audit-intelligence"
version = "0.2.0"
description = "Plataforma de auditoría inteligente de actas del Consejo Federal Pesquero de Argentina"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["fisheries", "argentina", "audit", "nlp", "transparency"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
